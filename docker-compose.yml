version: '3.8'

services:

  discovery-server:
    image: discovery-server:v1
    container_name: discovery-server
    ports:
      - "8761:8761"

  account-service:
    image: account-service:v1
    container_name: account-service
    ports:
      - "8081:8081"
    depends_on:
      - discovery-server

  customer-service:
    image: customer-service:v1
    container_name: customer-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-server

  loan-service:
    image: loan-service:v1
    container_name: loan-service
    ports:
      - "8083:8083"
    depends_on:
      - discovery-server

  transaction-service:
    image: transaction-service:v1
    container_name: transaction-service
    ports:
      - "8084:8084"
    depends_on:
      - discovery-server

  api-gateway:
    image: api-gateway:v1
    container_name: api-gateway
    ports:
      - "8085:8085"
    depends_on:
      - discovery-server
      - account-service
      - customer-service
      - loan-service
      - transaction-service